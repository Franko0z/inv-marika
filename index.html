<div id="app-root">
<style>
  #app-root {
    --gold: #c9a35f;
    --gold-light: #e8cf9e;
    --gold-deep: #8a6d2f;
    --ink: #0d0d12;
    --ink-2: #16161d;
    --cream: #f4ecd8;
    --wax: #7a1f1f;
    all: initial;
    display: block;
    font-family: 'Georgia', serif;
    box-sizing: border-box;
  }
  #app-root *, #app-root *::before, #app-root *::after { box-sizing: border-box; }

  #app-root .stage {
    min-height: 100vh;
    width: 100%;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(201,163,95,0.18), transparent 55%),
      linear-gradient(180deg, #08080c 0%, #101014 55%, #08080c 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    position: relative;
    overflow: hidden;
  }

  /* drifting gold flecks, echoing the invite's glitter rain */
  #app-root .flecks span {
    position: absolute;
    top: -10%;
    width: 2px;
    height: 14px;
    background: linear-gradient(180deg, transparent, var(--gold-light), transparent);
    opacity: 0.55;
    animation: drift linear infinite;
  }
  @keyframes drift {
    to { transform: translateY(120vh); }
  }

  #app-root .caption {
    position: absolute;
    top: 34px;
    left: 0;
    right: 0;
    text-align: center;
    color: var(--gold-light);
    letter-spacing: 0.35em;
    font-size: 11px;
    text-transform: uppercase;
    opacity: 0.7;
    font-family: Georgia, serif;
  }

  /* ===== Envelope ===== */
  #app-root .envelope-wrap {
    perspective: 1400px;
    width: min(88vw, 360px);
    transition: opacity 0.55s cubic-bezier(.4,0,.2,1) 0.25s, transform 0.55s cubic-bezier(.4,0,.2,1) 0.25s;
    will-change: opacity, transform;
  }
  #app-root .envelope-wrap.hidden {
    opacity: 0;
    transform: scale(0.92);
    pointer-events: none;
  }

  #app-root .envelope {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 2;
    cursor: pointer;
    background: linear-gradient(155deg, #1b1b22, #0e0e12 60%);
    border: 1px solid rgba(201,163,95,0.4);
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.7),
      0 0 0 1px rgba(201,163,95,0.08) inset;
    outline: none;
    padding: 0;
    margin: 0;
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    transform-style: preserve-3d;
  }
  #app-root .envelope:focus-visible {
    box-shadow: 0 0 0 3px var(--gold-light), 0 30px 60px -20px rgba(0,0,0,0.7);
  }

  #app-root .env-pocket-left,
  #app-root .env-pocket-right,
  #app-root .env-pocket-bottom {
    position: absolute;
    width: 0; height: 0;
    border-style: solid;
  }
  #app-root .env-pocket-bottom {
    bottom: 0; left: 0;
    border-width: 0 0 78px 100%;
    border-color: transparent transparent #131318 transparent;
    width: 100%;
  }
  #app-root .env-pocket-left {
    top: 0; left: 0;
    border-width: 100% 0 0 50%;
    border-color: transparent transparent transparent #1d1d24;
  }
  #app-root .env-pocket-right {
    top: 0; right: 0;
    border-width: 0 0 100% 50%;
    border-color: transparent transparent transparent #191920;
  }

  #app-root .env-flap {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 62%;
    background: linear-gradient(160deg, #232329, #131318 70%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transform-style: preserve-3d;
    transform: rotateX(0deg) translateZ(0);
    transition: transform 1.3s cubic-bezier(.45,0,.2,1);
    will-change: transform;
    contain: layout paint;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    perspective: 1400px;
    -webkit-perspective: 1400px;
    z-index: 6;
    border-bottom: 1px solid rgba(201,163,95,0.18);
  }
  #app-root .envelope.flap-open .env-flap {
    transform: rotateX(180deg) translateZ(0);
    z-index: 1;
  }

  #app-root .env-seal {
    position: absolute;
    top: 34%;
    left: 50%;
    width: 54px;
    height: 54px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 35% 30%, #9c3030, var(--wax) 60%, #5e1414 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold-light);
    font-family: 'Times New Roman', serif;
    font-size: 22px;
    font-style: italic;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(0,0,0,0.2);
    z-index: 7;
    transition: transform 0.35s ease, box-shadow 0.35s ease;
}
  #app-root .envelope:hover .env-seal { transform: translate(-50%, -50%) scale(1.06); }
  #app-root .envelope.flap-open .env-seal {
    opacity: 0;
    transition: opacity 0.25s ease;
}
  #app-root .envelope:not(.flap-open) .env-seal {
    opacity: 1;
    transition: opacity 0.3s ease 1.3s;
}

  #app-root .env-hint {
    position: absolute;
    bottom: 14px;
    left: 0; right: 0;
    text-align: center;
    color: rgba(232, 207, 158, 0.65);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    z-index: 4;
  }

  #app-root .letter-peek {
    position: absolute;
    top: 8%;
    left: 8%;
    right: 8%;
    height: 78%;
    background: linear-gradient(180deg, var(--cream), #ece2c8);
    border-radius: 2px 2px 0 0;
    z-index: 3;
    transform: translateY(0) scale(0.98);
    will-change: transform;
    transition: transform 2s cubic-bezier(0, 0, .15, 1) 1s;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.25);
  }
  #app-root .envelope.letter-out .letter-peek {
    transform: translateY(-140%) scale(1);
  }
  #app-root .envelope.letter-closing .letter-peek {
  transition: transform 0.9s cubic-bezier(.4,0,.2,1) 0s;
}
  #app-root .letter-peek::before {
    content: 'M';
    position: absolute;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Times New Roman', serif;
    font-style: italic;
    font-size: 26px;
    color: var(--gold-deep);
    letter-spacing: 0.05em;
  }

  /* ===== Reveal ===== */
  #app-root .reveal {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s cubic-bezier(.4,0,.2,1);
    z-index: 20;
  }
  #app-root .reveal.show {
    opacity: 1;
    pointer-events: auto;
  }
  #app-root .reveal-card {
    position: relative;
    max-width: min(98vw, 900px);
    max-height: 96vh;
    width: 100%;
    transform: scale(0.88) translateY(36px);
    opacity: 0;
    filter: blur(6px);
    will-change: transform, opacity, filter;
    transition: transform 1s cubic-bezier(.16,.84,.24,1) 0.15s,
                opacity 0.75s ease 0.15s,
                filter 0.9s ease 0.15s;
  }
  #app-root .reveal.show .reveal-card {
    transform: scale(1) translateY(0);
    opacity: 1;
    filter: blur(0);
  }
  #app-root .reveal-card img {
    width: 100%;
    max-height: 96vh;
    object-fit: contain;
    display: block;
    border-radius: 3px;
    box-shadow: 0 40px 90px -20px rgba(0,0,0,0.85), 0 0 0 1px rgba(201,163,95,0.35);
    transform: scale(1.04);
    transition: transform 1.1s cubic-bezier(.16,.84,.24,1) 0.2s;
  }
  #app-root .reveal.show .reveal-card img {
    transform: scale(1);
  }
  #app-root .reveal-frame {
    position: absolute;
    inset: -10px;
    border: 1px solid rgba(201,163,95,0.55);
    pointer-events: none;
  }

  #app-root .close-btn {
    position: absolute;
    top: -18px;
    right: -6px;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--ink-2);
    border: 1px solid rgba(201,163,95,0.5);
    color: var(--gold-light);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease, background 0.2s ease;
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #app-root .close-btn:hover { background: #222; transform: rotate(90deg); }
  #app-root .close-btn:focus-visible { box-shadow: 0 0 0 2px var(--gold-light); }

 /* @media (prefers-reduced-motion: reduce) {
    #app-root .env-flap, #app-root .letter-peek, #app-root .envelope-wrap, #app-root .reveal, #app-root .reveal-card {
      transition-duration: 0.01ms !important;
    } 
    #app-root .flecks span { animation: none; opacity: 0.25; }
  */
</style>

    s.style.left = (Math.random() * 100) + '%';
    s.style.animationDuration = (6 + Math.random() * 8) + 's';
    s.style.animationDelay = (Math.random() * 8) + 's';
    s.style.height = (8 + Math.random() * 14) + 'px';
    flecks.appendChild(s);
  }

function openEnvelope() {
  if (envelope.classList.contains('flap-open')) return;
  envelope.classList.add('flap-open');
  envelope.setAttribute('aria-expanded', 'true');
  setTimeout(function () {
    envelope.classList.add('letter-out');
  }, 500); // il flap inizia ad aprirsi prima del foglio

  setTimeout(function () {
    envWrap.classList.add('hidden');
    reveal.classList.add('show');
    closeBtn.focus();
  }, 2700);
}

function closeReveal() {
  reveal.classList.remove('show');
  envWrap.classList.remove('hidden');

  // fase 1: il foglio rientra SENZA il delay di apertura
  envelope.classList.add('letter-closing');
  envelope.classList.remove('letter-out');

  // fase 2: solo dopo che il foglio è rientrato, chiude il flap
  setTimeout(function () {
    envelope.classList.remove('flap-open');
    envelope.classList.remove('letter-closing');
    envelope.setAttribute('aria-expanded', 'false');
    envelope.focus();
  }, 950); // leggermente più della durata di letter-closing (0.9s)
}
  var envTouched = false;
  envelope.addEventListener('touchend', function (e) {
    envTouched = true;
    e.preventDefault();
    openEnvelope();
    setTimeout(function () { envTouched = false; }, 400);
  }, { passive: false });
  envelope.addEventListener('click', function () {
    if (envTouched) return;
    openEnvelope();
  });
  envelope.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEnvelope(); }
  });

  var closeTouched = false;
  closeBtn.addEventListener('touchend', function (e) {
    closeTouched = true;
    e.preventDefault();
    e.stopPropagation();
    closeReveal();
    setTimeout(function () { closeTouched = false; }, 400);
  }, { passive: false });
  closeBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (closeTouched) return;
    closeReveal();
  });
  reveal.addEventListener('click', function (e) {
    if (e.target === reveal) closeReveal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && reveal.classList.contains('show')) closeReveal();
  });
})();
</script>
</div>
